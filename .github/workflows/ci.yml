name: CI

on: push

permissions:
  contents: read

env:
  # Not a secret: it names the project, the API key grants access.
  NEON_PROJECT_ID: quiet-king-49553823

# Actions are pinned to a commit hash, not a tag: a tag can be moved to
# other code, a hash cannot. Dependabot (.github/dependabot.yml) proposes
# new hashes as pull requests.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The full history, so the secret scan sees every pushed commit.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked

      # Through the Makefile, so CI proves its targets work: lint runs for
      # real (ruff, ruff format, sqlfluff); the rest are printed, not run,
      # which catches a broken target without needing a database.
      - name: Lint
        run: make lint

      - name: Check the Makefile
        run: make --dry-run db load security build test analytics dashboard deploy

      # gitleaks also runs before every commit, but only on the laptop that
      # has pre-commit installed, and only on staged changes. This scans
      # every commit in the push, wherever it was made. No licence is needed
      # for a personal account.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Each run gets a throwaway copy of Neon main, so tests never touch main
      # and there is no long-lived CI branch to go stale. The branch expires
      # after an hour in case the delete step at the end never runs.
      - name: Set branch expiry
        id: expiry
        run: echo "at=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.at }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # Fails loudly if the branch is unreachable; without a database the
      # loader tests would skip instead of failing.
      - name: Check CI database connection
        run: uv run python -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL']).close(); print('connected')"
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      # Before dbt build: the row-level security policies dbt adds to the
      # facts name these roles, the default privileges must be in place for
      # the marts_public views, the audit triggers dbt adds to the
      # dimensions call audit.sql's function, and dim_patient calls
      # pseudonymize.sql's. psql comes with the runner.
      - name: Apply security
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f security/roles.sql -f security/minimization.sql
          -f security/audit.sql -f security/pseudonymize.sql
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      # The branch is a copy of main, so raw is already loaded.
      - name: dbt build
        run: uv run dbt build --project-dir dbt --profiles-dir dbt
        env:
          DBT_HOST: ${{ steps.neon.outputs.db_host }}
          DBT_USER: neondb_owner
          DBT_PASSWORD: ${{ steps.neon.outputs.password }}
          DBT_DBNAME: neondb
          DBT_SSLMODE: require
          ICU_HMAC_KEY: ${{ secrets.ICU_HMAC_KEY }}

      # After dbt build: the security tests check each role's access and
      # the row-level security on the marts. The key-rotation test runs dbt
      # itself, so it needs dbt's connection and the HMAC key.
      - name: Test
        run: uv run pytest
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          DBT_HOST: ${{ steps.neon.outputs.db_host }}
          DBT_USER: neondb_owner
          DBT_PASSWORD: ${{ steps.neon.outputs.password }}
          DBT_DBNAME: neondb
          DBT_SSLMODE: require
          ICU_HMAC_KEY: ${{ secrets.ICU_HMAC_KEY }}

      # Every query must run against the freshly built marts, and the
      # committed results must match what the queries return.
      - name: Analytic queries
        run: uv run python -m analytics.run --check
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      # dbt's documentation site, for GitHub Pages. Generated and checked on
      # every push, so a pull request proves it; uploaded from main only.
      # --static puts the whole site in one file, so only that file is
      # published; dbt's other files in target/ hold the HMAC key and stay
      # on the runner.
      - name: Generate dbt docs
        run: |
          uv run dbt docs generate --static --project-dir dbt --profiles-dir dbt
          mkdir -p site
          cp dbt/target/static_index.html site/index.html
        env:
          DBT_HOST: ${{ steps.neon.outputs.db_host }}
          DBT_USER: neondb_owner
          DBT_PASSWORD: ${{ steps.neon.outputs.password }}
          DBT_DBNAME: neondb
          DBT_SSLMODE: require
          ICU_HMAC_KEY: ${{ secrets.ICU_HMAC_KEY }}

      # Nothing secret may be published: stop if the site contains the HMAC
      # key or the CI branch's database password.
      - name: Check the docs hold no secret
        run: |
          for secret in "$ICU_HMAC_KEY" "$DBT_PASSWORD"; do
            if [ -z "$secret" ] || grep -qF -- "$secret" site/index.html; then
              echo "::error::a secret is missing or appears in the docs site"
              exit 1
            fi
          done
          echo "no secret in site/index.html"
        env:
          ICU_HMAC_KEY: ${{ secrets.ICU_HMAC_KEY }}
          DBT_PASSWORD: ${{ steps.neon.outputs.password }}

      - name: Upload the docs site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Delete Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        run: >-
          curl --fail-with-body -sS -X DELETE
          -H "Authorization: Bearer $NEON_API_KEY"
          "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}

  # Publishes the docs site that the test job checked and uploaded. A job of
  # its own, so only this job may write to GitHub Pages.
  docs:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
