models:
  - name: dim_admission
    description: >
      One row per hospital admission, plus the "outside an admission" row
      (admission_key -1) for lab results taken outside an admission.
    columns:
      - name: admission_key
        data_tests:
          - unique
          - not_null
      - name: hadm_id
        description: Null only on the -1 row.
        data_tests:
          - unique
      - name: admission_type
        data_tests:
          - not_null
