sources:
  # Both MIMIC modules are loaded into the one raw schema by loader/load_raw.py,
  # all columns as text. A source per module keeps the hosp/icu split visible.
  - name: hosp
    schema: raw
    tables:
      - name: patients
      - name: admissions
      - name: diagnoses_icd
      - name: d_icd_diagnoses
      - name: labevents
      - name: d_labitems
      - name: transfers

  - name: icu
    schema: raw
    tables:
      - name: icustays
      - name: chartevents
      - name: d_items
