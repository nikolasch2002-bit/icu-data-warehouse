models:
  - name: patients
    description: Public, one row per patient. No identifiers, no date of death.
    columns:
      - name: gender
        data_tests:
          - not_null
      - name: age_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['20-29', '30-39', '40-49', '50-59', '60-69', '70-79', '80-89', '90+']

  - name: hospital_admissions
    description: Public, one row per hospital admission. No identifiers or dates.
    columns:
      - name: age_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['20-29', '30-39', '40-49', '50-59', '60-69', '70-79', '80-89', '90+']
      - name: los_days
        data_tests:
          - not_null
      - name: died_in_hospital
        data_tests:
          - not_null

  - name: icu_stays
    description: Public, one row per ICU stay. No identifiers or dates.
    columns:
      - name: age_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['20-29', '30-39', '40-49', '50-59', '60-69', '70-79', '80-89', '90+']
      - name: first_care_unit
        data_tests:
          - not_null
      - name: icu_los_days
        data_tests:
          - not_null

  - name: lab_trends
    description: >
      Public, lab value quartiles per lab test, first care unit and day of
      the ICU stay. Aggregated: no single result.
    columns:
      - name: icu_day
        description: Whole days since ICU admission; 0 is the first 24 hours.
        data_tests:
          - not_null
      - name: results
        data_tests:
          - not_null
