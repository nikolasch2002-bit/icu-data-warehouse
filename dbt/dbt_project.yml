name: icu_warehouse
version: "0.1.0"
profile: icu_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

flags:
  send_anonymous_usage_stats: false

# pgcrypto provides hmac() and digest() for dim_patient's subject_key.
on-run-start:
  - "create extension if not exists pgcrypto"

models:
  icu_warehouse:
    staging:
      +schema: staging
      +materialized: view
    # Tables, not views: the dashboard and the analytic queries read the
    # marts over and over, so they are computed once per build.
    marts:
      +schema: marts
      +materialized: table
      # Audit trigger on the dimensions (macros/audit_trigger.sql). Hooks
      # add up, so the facts keep their own row-level security hook.
      +post-hook: "{{ audit_trigger() }}"
    # What the public dashboard may read (security/minimization.sql grants
    # it). Views, so they always show the current marts; built by dbt
    # because rebuilding a marts table drops the views that depend on it.
    marts_public:
      +schema: marts_public
      +materialized: view

# Small hand-curated reference tables, kept as CSV so they can be reviewed.
seeds:
  icu_warehouse:
    +schema: seeds
