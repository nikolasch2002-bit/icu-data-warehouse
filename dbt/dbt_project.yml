name: icu_warehouse
version: "0.1.0"
profile: icu_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

flags:
  send_anonymous_usage_stats: false

# pgcrypto provides hmac() and digest() for dim_patient's subject_key.
on-run-start:
  - "create extension if not exists pgcrypto"

models:
  icu_warehouse:
    staging:
      +schema: staging
      +materialized: view
    # Tables, not views: the dashboard and the analytic queries read the
    # marts over and over, so they are computed once per build.
    marts:
      +schema: marts
      +materialized: table

# Small hand-curated reference tables, kept as CSV so they can be reviewed.
seeds:
  icu_warehouse:
    +schema: seeds
