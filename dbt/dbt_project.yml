name: icu_warehouse
version: "0.1.0"
profile: icu_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

flags:
  send_anonymous_usage_stats: false

models:
  icu_warehouse:
    staging:
      +schema: staging
      +materialized: view
    # Tables, not views: the dashboard and the analytic queries read the
    # marts over and over, so they are computed once per build.
    marts:
      +schema: marts
      +materialized: table
